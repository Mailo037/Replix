[package]
name = "replix"
version = "0.4.0"
description = "Clip the last moments of any game"
edition = "2021"

[lib]
name = "replix_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the corner toast needs a see-through window on macOS too.
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
trash = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
nnnoiseless = { version = "0.5.2", default-features = false }
tauri-plugin-drag = "2"
# Text the editor draws arrives as a PNG data URL.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_Media_Audio",
] }
# The same version Tauri uses, to ask WebView2 to give back memory while hidden.
webview2-com = "0.39"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Talks to the X server directly (no C library): windows, the active one, monitors.
x11rb = { version = "0.13", features = ["randr"] }
# The desktop's GlobalShortcuts portal, for hotkeys under Wayland (D-Bus in Rust, no C library).
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
futures-channel = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
core-foundation = "0.10"
core-graphics = "0.25"

# Debug info would need several GB of disk for this dependency tree.
[profile.dev]
debug = 0
incremental = false

# Noise suppression runs on the microphone all the time while recording; unoptimised it
# costs the dev build several times what it costs a release. Built once, so it does not
# slow down rebuilds.
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
